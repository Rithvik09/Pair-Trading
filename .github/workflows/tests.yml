name: tests

on:
  push:
    paths-ignore: ["state/**"]  # the daily bot commit doesn't need a test run
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: requirements.txt matches uv.lock (Streamlit Cloud installs from it)
        run: uv export --no-dev --no-hashes --no-header --format requirements-txt | diff - requirements.txt
