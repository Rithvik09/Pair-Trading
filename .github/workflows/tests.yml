name: tests

on:
  push:
    paths-ignore: ["state/**"]  # the daily bot commit doesn't need a test run
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: requirements.txt matches uv.lock (Streamlit Cloud installs from it)
        run: uv export --no-dev --no-hashes --no-header --format requirements-txt | diff - requirements.txt
