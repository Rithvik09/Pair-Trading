# Settings for the daily job. Edit on GitHub (pencil icon) and commit: the next daily run
# and the dashboard pick it up. Find candidate pairs on the dashboard's Scanner tab.

# Pairs to trade, as [Y, X]. A short spread shorts Y and buys X; a long spread the reverse.
# From `uv run python -m pairs.cli shortlist` on 2026-10-27 (S&P 1500, same sub-industry),
# best backtest Sharpe first. The edge is unproven: these filters made money in 2023-2025
# but broke even in 2025-26, a year in which almost every variant tried lost money (see
# README, "Why these filters"). Watch the model book before trading real money.
# Rerun the shortlist every few months; drop a pair once it stops qualifying and it has no
# open position.
